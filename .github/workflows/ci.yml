name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Translations (parity, placeholders, rich-text tags)
        # Fails on stray/mismatched keys or broken {{placeholders}}/<tags>. Untranslated keys
        # only warn (they fall back to English); add --strict to require 100% once a language is complete.
        run: npm run i18n:check

      - name: Type-check
        # -p is required: the root tsconfig.json only has "references" and
        # no "files"/"include" of its own, so `tsc --noEmit` with no -p
        # silently type-checks zero files and always exits 0. Pointing at
        # tsconfig.app.json directly is what actually checks src/.
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
